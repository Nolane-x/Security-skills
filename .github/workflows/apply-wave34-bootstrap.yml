name: apply-wave34-bootstrap

on:
  push:
    branches:
      - wave34/domain-and-evidence-orchestration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify archive identity and extract exact manifest
        shell: bash
        run: |
          set -euo pipefail
          cat .wave34/current*.b64 > /tmp/wave34.b64
          base64 --decode /tmp/wave34.b64 > /tmp/wave34.tar.gz
          echo '19a050644806ca522b382dcaca852b43b94c177c0cb6d16c64b2a3cb37ca34b2  /tmp/wave34.tar.gz' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import tarfile

          expected = [
              line.strip()
              for line in Path('.wave34/FILES.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if len(expected) != 122 or len(set(expected)) != 122:
              raise SystemExit(f'invalid manifest cardinality: {len(expected)}')

          with tarfile.open('/tmp/wave34.tar.gz', 'r:gz') as tf:
              members = tf.getmembers()
              actual = [member.name for member in members]
              if len(actual) != 122 or sorted(actual) != sorted(expected):
                  missing = sorted(set(expected) - set(actual))
                  extra = sorted(set(actual) - set(expected))
                  raise SystemExit(f'archive manifest mismatch; missing={missing}; extra={extra}')

              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  source = tf.extractfile(member)
                  if source is None:
                      raise SystemExit(f'cannot read archive member: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with source, target.open('wb') as out:
                      shutil.copyfileobj(source, out)

          print('ARCHIVE_MANIFEST_VERIFIED=122')
          PY
          git rm -r .wave34
          git rm .github/workflows/apply-wave34-bootstrap.yml

      - name: Run Wave 3-4 verification gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_skills.py
          python scripts/validate_graph.py
          python scripts/build_catalog.py
          python scripts/build_graph.py
          python scripts/build_catalog.py --check
          python scripts/build_graph.py --check
          python scripts/validate_case.py examples/research-case.example.json
          python scripts/route_skills.py examples/research-case.example.json --limit 12
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          import json

          paths = sorted(Path('skills').glob('*/skill.meta.json'))
          paths += sorted(Path('packs').glob('*.json'))
          paths += [
              Path('schemas/research-case.schema.json'),
              Path('examples/research-case.example.json'),
              Path('sources/research-systems.json'),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
          if len(paths) != 106:
              raise SystemExit(f'unexpected canonical JSON count: {len(paths)}')
          print('CANONICAL_JSON_PARSE=106')
          PY
          git diff --check
          echo 'WAVE34_BOOTSTRAP_GATE=PASS'

      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'feat: add wave3-4 domain and evidence orchestration'
          git push origin HEAD:${GITHUB_REF_NAME}
