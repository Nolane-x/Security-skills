name: validate-security-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate canonical skills
        run: python scripts/validate_skills.py

      - name: Validate operator depth profiles
        run: python scripts/validate_operator_depth.py

      - name: Validate release baseline
        run: python scripts/validate_release_baseline.py

      - name: Validate skill graph
        run: python scripts/validate_graph.py

      - name: Build generated indexes
        run: |
          python scripts/build_catalog.py
          python scripts/build_graph.py

      - name: Check generated indexes
        run: |
          python scripts/build_catalog.py --check
          python scripts/build_graph.py --check

      - name: Validate benchmarks
        run: python scripts/validate_benchmarks.py

      - name: Run portability benchmark
        run: python scripts/run_benchmarks.py benchmarks/suites/portability.json

      - name: Validate agent evaluation contracts
        run: |
          python scripts/prepare_agent_tasks.py benchmarks/suites/portability.json --out agent-tasks
          python scripts/prepare_replay_runs.py benchmarks/suites/portability.json --profile reference --out agent-runs-reference
          python scripts/validate_agent_runs.py agent-runs-reference

      - name: Run agent evaluation portability smoke
        run: python scripts/evaluate_agent_runs.py benchmarks/suites/portability.json agent-runs-reference --json agent-smoke.json

      - name: Run tests
        run: python -m unittest discover -s tests -v

  benchmark-core:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate benchmark corpus
        run: python scripts/validate_benchmarks.py

      - name: Run core benchmark twice
        run: |
          python scripts/run_benchmarks.py benchmarks/suites/core.json --json core-a.json --report core-report.md
          python scripts/run_benchmarks.py benchmarks/suites/core.json --json core-b.json

      - name: Check byte-identical benchmark result
        run: python -c "from pathlib import Path; assert Path('core-a.json').read_bytes() == Path('core-b.json').read_bytes(), 'core benchmark result drifted between identical runs'; print('Core benchmark deterministic output check passed.')"

  agent-eval-core:
    needs: [validate, benchmark-core]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare agent tasks twice
        run: |
          python scripts/prepare_agent_tasks.py benchmarks/suites/portability.json --out tasks-a
          python scripts/prepare_agent_tasks.py benchmarks/suites/portability.json --out tasks-b

      - name: Check byte-identical agent tasks
        run: |
          python - <<'PY'
          from pathlib import Path
          def snapshot(root):
              return [(p.relative_to(root).as_posix(), p.read_bytes()) for p in sorted(root.rglob('*.json'))]
          a, b = Path('tasks-a'), Path('tasks-b')
          assert snapshot(a) == snapshot(b), 'prepared agent tasks drifted between identical runs'
          print('Agent task deterministic output check passed.')
          PY

      - name: Prepare replay profiles
        run: |
          python scripts/prepare_replay_runs.py benchmarks/suites/portability.json --profile reference --out runs-reference
          python scripts/prepare_replay_runs.py benchmarks/suites/portability.json --profile cautious --out runs-cautious
          python scripts/prepare_replay_runs.py benchmarks/suites/portability.json --profile faulty --out runs-faulty
          python scripts/validate_agent_runs.py runs-reference
          python scripts/validate_agent_runs.py runs-cautious
          python scripts/validate_agent_runs.py runs-faulty

      - name: Evaluate reference replay twice
        run: |
          python scripts/evaluate_agent_runs.py benchmarks/suites/portability.json runs-reference --json reference-a.json --report reference-report.md
          python scripts/evaluate_agent_runs.py benchmarks/suites/portability.json runs-reference --json reference-b.json
          python - <<'PY'
          import json
          data = json.load(open('reference-a.json', encoding='utf-8'))
          assert data['passed'] is True
          assert len(data['agents']) == 1
          agent = data['agents'][0]
          assert agent['overall_score'] == 100.0, agent
          assert agent['hard_gate_failure_count'] == 0, agent
          assert agent['missing_fixture_ids'] == [], agent
          print('Reference replay conformance check passed.')
          PY

      - name: Check byte-identical agent evaluation
        run: python -c "from pathlib import Path; assert Path('reference-a.json').read_bytes() == Path('reference-b.json').read_bytes(), 'agent evaluation drifted between identical runs'; print('Agent evaluation deterministic output check passed.')"

      - name: Exercise cautious and faulty replay profiles
        shell: bash
        run: |
          set +e
          python scripts/evaluate_agent_runs.py benchmarks/suites/portability.json runs-cautious --json cautious.json
          cautious_rc=$?
          python scripts/evaluate_agent_runs.py benchmarks/suites/portability.json runs-faulty --json faulty.json
          faulty_rc=$?
          set -e
          test "$cautious_rc" -eq 1
          test "$faulty_rc" -eq 1
          python - <<'PY'
          import json
          cautious = json.load(open('cautious.json', encoding='utf-8'))
          faulty = json.load(open('faulty.json', encoding='utf-8'))
          assert cautious['passed'] is False
          assert all(a['hard_gate_failure_count'] == 0 for a in cautious['agents']), cautious
          assert all(a['overall_score'] < 100.0 for a in cautious['agents']), cautious
          assert faulty['passed'] is False
          assert any(a['hard_gate_failure_count'] > 0 or a['failed_fixture_count'] > 0 for a in faulty['agents']), faulty
          print('Negative replay profile checks passed.')
          PY

      - name: Build cross-agent matrix twice
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from evaluate_agent_runs import evaluate_paths
          from agent_matrix import normalize_matrix
          paths = []
          for name in ('runs-reference', 'runs-cautious', 'runs-faulty'):
              paths.extend(sorted(Path(name).glob('*.json')))
          for output in ('matrix-a.json', 'matrix-b.json'):
              matrix, _ = evaluate_paths(Path('.'), Path('benchmarks/suites/portability.json'), paths)
              Path(output).write_text(normalize_matrix(matrix), encoding='utf-8')
          PY

      - name: Check byte-identical cross-agent matrix
        run: python -c "from pathlib import Path; assert Path('matrix-a.json').read_bytes() == Path('matrix-b.json').read_bytes(), 'cross-agent matrix drifted between identical builds'; print('Cross-agent matrix deterministic output check passed.')"

  superiority-court-core:
    needs: [validate, benchmark-core, agent-eval-core]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build contestant views twice
        run: |
          python scripts/build_contestant_view.py --out "$RUNNER_TEMP/security-skills-contestant-a"
          python scripts/build_contestant_view.py --out "$RUNNER_TEMP/security-skills-contestant-b"

      - name: Check byte-identical contestant views
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          def snapshot(root):
              return [(p.relative_to(root).as_posix(), p.read_bytes()) for p in sorted(root.rglob('*')) if p.is_file()]
          a = Path(os.environ['RUNNER_TEMP']) / 'security-skills-contestant-a'
          b = Path(os.environ['RUNNER_TEMP']) / 'security-skills-contestant-b'
          assert snapshot(a) == snapshot(b), 'byte-identical contestant views check failed'
          print('byte-identical contestant views check passed.')
          PY

      - name: Prepare superiority tasks twice
        run: |
          python scripts/prepare_superiority_tasks.py superiority/suites/core.json --out superiority-tasks-a
          python scripts/prepare_superiority_tasks.py superiority/suites/core.json --out superiority-tasks-b

      - name: Check byte-identical superiority tasks
        run: |
          python - <<'PY'
          from pathlib import Path
          def snapshot(root):
              return [(p.relative_to(root).as_posix(), p.read_bytes()) for p in sorted(root.rglob('*.json'))]
          assert snapshot(Path('superiority-tasks-a')) == snapshot(Path('superiority-tasks-b')), 'byte-identical superiority tasks check failed'
          print('byte-identical superiority tasks check passed.')
          PY

      - name: Prepare superiority replay profiles
        run: |
          SURFACE_A=$(python -c "import json, os; from pathlib import Path; p = Path(os.environ['RUNNER_TEMP']) / 'security-skills-contestant-a' / 'CONTESTANT_VIEW.json'; print(json.load(open(p, encoding='utf-8'))['surface_digest'])")
          SURFACE_B=$(python -c "import json, os; from pathlib import Path; p = Path(os.environ['RUNNER_TEMP']) / 'security-skills-contestant-b' / 'CONTESTANT_VIEW.json'; print(json.load(open(p, encoding='utf-8'))['surface_digest'])")
          python scripts/prepare_superiority_replays.py superiority/suites/core.json --profile reference --contestant-id opaque-a --surface-digest "$SURFACE_A" --out superiority-runs-reference
          python scripts/prepare_superiority_replays.py superiority/suites/core.json --profile degraded --contestant-id opaque-b --surface-digest "$SURFACE_B" --out superiority-runs-degraded

      - name: Score superiority profiles twice
        run: |
          python scripts/score_superiority_runs.py superiority/suites/core.json superiority-runs-reference --manifest superiority-tasks-a/SUITE_MANIFEST.json --json superiority-reference-a.json
          python scripts/score_superiority_runs.py superiority/suites/core.json superiority-runs-reference --manifest superiority-tasks-b/SUITE_MANIFEST.json --json superiority-reference-b.json
          python scripts/score_superiority_runs.py superiority/suites/core.json superiority-runs-degraded --manifest superiority-tasks-a/SUITE_MANIFEST.json --json superiority-degraded-a.json
          python scripts/score_superiority_runs.py superiority/suites/core.json superiority-runs-degraded --manifest superiority-tasks-b/SUITE_MANIFEST.json --json superiority-degraded-b.json

      - name: Check byte-identical superiority scores
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path('superiority-reference-a.json').read_bytes() == Path('superiority-reference-b.json').read_bytes(), 'byte-identical superiority scores check failed for reference'
          assert Path('superiority-degraded-a.json').read_bytes() == Path('superiority-degraded-b.json').read_bytes(), 'byte-identical superiority scores check failed for degraded'
          print('byte-identical superiority scores check passed.')
          PY

      - name: Build superiority court twice
        run: |
          python scripts/build_superiority_court.py superiority/suites/core.json superiority-reference-a.json superiority-degraded-a.json --json superiority-court-a.json
          python scripts/build_superiority_court.py superiority/suites/core.json superiority-reference-b.json superiority-degraded-b.json --json superiority-court-b.json

      - name: Check byte-identical superiority court
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          assert Path('superiority-court-a.json').read_bytes() == Path('superiority-court-b.json').read_bytes(), 'byte-identical superiority court check failed'
          data = json.load(open('superiority-court-a.json', encoding='utf-8'))
          manifest = json.load(open('superiority-tasks-a/SUITE_MANIFEST.json', encoding='utf-8'))
          view_a = json.load(open(Path(os.environ['RUNNER_TEMP']) / 'security-skills-contestant-a' / 'CONTESTANT_VIEW.json', encoding='utf-8'))
          view_b = json.load(open(Path(os.environ['RUNNER_TEMP']) / 'security-skills-contestant-b' / 'CONTESTANT_VIEW.json', encoding='utf-8'))
          contestants = {item['contestant_id']: item for item in data['contestants']}
          assert data['authority_commitment'] == manifest['authority_commitment'], data
          assert data['absolute_winner'] == 'opaque-a', data
          assert len(data['pairwise']) == 1, data
          assert data['pairwise'][0]['verdict'] == 'left-absolute-superiority', data
          assert view_a['surface_digest'] == view_b['surface_digest'], (view_a, view_b)
          assert contestants['opaque-a']['contestant_surface_digest'] == view_a['surface_digest'], contestants
          assert contestants['opaque-b']['contestant_surface_digest'] == view_b['surface_digest'], contestants
          print('byte-identical superiority court check passed.')
          PY
