name: validate-security-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate canonical skills
        run: python scripts/validate_skills.py

      - name: Validate skill graph
        run: python scripts/validate_graph.py

      - name: Build generated indexes
        run: |
          python scripts/build_catalog.py
          python scripts/build_graph.py

      - name: Check generated indexes
        run: |
          python scripts/build_catalog.py --check
          python scripts/build_graph.py --check

      - name: Run tests
        run: python -m unittest discover -s tests -v
